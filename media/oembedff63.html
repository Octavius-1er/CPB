  <script>
(function(){
  // Nav sticky shadow
  var h=document.getElementById('header');
  if(h)window.addEventListener('scroll',function(){h.classList.toggle('scrolled',window.scrollY>8);},{passive:true});
  // Scroll reveal
  var els=document.querySelectorAll('.views-row,.block-views,#block-coordonnees,.featured-bottom .block');
  if('IntersectionObserver'in window){
    els.forEach(function(el){el.classList.add('cpb-reveal');});
    var obs=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target);}});},{threshold:0.1,rootMargin:'0px 0px -30px 0px'});
    els.forEach(function(el){obs.observe(el);});
  }
  // Nav sticky apres barre contact
  (function(){
    var hdr=document.getElementById('header');
    var nav=document.querySelector('.region-header');
    var sec=document.querySelector('.region-secondary-menu');
    if(!hdr||!nav)return;
    function check(){var t=sec?sec.offsetHeight:0;var s=window.scrollY>=t;nav.classList.toggle('is-sticky',s);hdr.classList.toggle('nav-fixed',s);}
    window.addEventListener('scroll',check,{passive:true});
    check();
  })();
})();
</script>
